name: Detect and Build Any Project

on:
  workflow_dispatch:
  push:
    branches: [ "feature/detect-build-demo" ]

jobs:
  detect-build-test:
    name: Detect build tool, install dependencies, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run automatic build script
        run: bash scripts/detect-and-build.sh

      - name: Upload all test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detected-project-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            build/reports/
            coverage/
          if-no-files-found: warn
